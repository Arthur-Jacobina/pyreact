[project]
name = "pyreact"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Edmar Miyake", email = "edmar.miyake@gmail.com" },
    { name = "Arthur Jacobina", email = "email27arthur@gmail.com" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "dspy>=3.0.1,<4.0.0",
    "fastapi[standard]>=0.116.1,<0.117.0",
    "nicegui>=2.21.1,<3.0.0",
    "optuna>=4",
    "uvicorn>=0.35.0,<0.36.0",
    "watchgod>=0.8.2,<0.9.0",
]

[project.optional-dependencies]
# OpenTelemetry export (pyreact_otel). The core never needs it.
otel = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.12.9,<0.13.0",
    # so the pyreact_otel tests run under a plain `uv run`
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["pyreact", "pyreact_durable", "pyreact_otel", "pyreact_sandbox"]

[tool.pytest.ini_options]
markers = [
    "examples: runs every example end to end offline (deselect with -m 'not examples')",
    "docker: needs a Docker daemon; skipped when unavailable (deselect with -m 'not docker')",
]
